<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiidoku</title>
<style>
:root{--bg:#fdf1f5;--fg:#4a3540;--card:#fff;--s:78%;--l:86%;--mut:#9a8590;--acc:#ec6a9c;--sh:rgba(120,60,90,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:22px 12px 34px}
h1{margin:0 0 4px;font-size:1.9rem;font-weight:900}
.sub{margin:0 0 16px;color:var(--mut);font-weight:600;font-size:.92rem;text-align:center;max-width:360px;line-height:1.4}
.stats{flex-wrap:wrap;justify-content:center;display:flex;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:20px;padding:8px 14px;text-align:center;min-width:78px;box-shadow:0 4px 14px var(--sh)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;font-weight:900}
.stat span{font-size:.8rem;color:var(--mut);font-weight:700}
.stat.hot b{color:var(--acc)}
#board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));touch-action:none;user-select:none;-webkit-user-select:none;gap:clamp(3px,1vw,6px);padding:clamp(6px,2vw,10px);width:min(92vw,450px);aspect-ratio:1;border-radius:28px;background:var(--card);box-shadow:0 8px 28px var(--sh)}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;padding:0;margin:0;border:0;border-radius:clamp(8px,2.6vw,16px);display:flex;align-items:center;justify-content:center;cursor:pointer;background:hsl(var(--h) var(--s) var(--l));box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.cell:active{transform:scale(.93)}
.cell:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.cell.bad{box-shadow:inset 0 0 0 3px #e5484d}
.x{font-size:clamp(14px,4.5vw,24px);font-weight:900;opacity:.4;pointer-events:none}
.cell .chi{position:absolute;inset:7%;width:86%;height:86%;object-fit:contain;pointer-events:none}
.cell.lock{cursor:default}
.x.red{color:#e5484d;opacity:1}
.cell.pop .chi{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#msg{min-height:3.4em;margin:14px 0 6px;text-align:center;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 20px;background:var(--card);color:var(--fg);cursor:pointer;box-shadow:0 3px 10px var(--sh)}
button.btn.main{background:var(--acc);color:#fff}
button.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.cell.pop .chi{animation:none}}
</style>
</head>
<body>


<h1>Chiidoku Shi</h1>
<p class="sub">A Chiikawa hides in every row, column and color. They can't touch, even diagonally. Tap or drag to mark ✕, double-tap to guess. Wrong guesses cost a heart.</p>

<div class="stats">
  <div class="stat hot"><b id="streak">0</b><span>streak</span></div>
  <div class="stat"><b id="best">0</b><span>best</span></div>
  <div class="stat"><b id="size">5×5</b><span>board</span></div>
  <div class="stat"><b id="hearts" style="color:#e5484d">♥♥♥</b><span>hearts</span></div>
</div>

<div id="board" role="grid" aria-label="Puzzle board"></div>
<div id="msg" aria-live="polite"></div>
<div class="row">
  <button class="btn" id="clear">Clear marks</button>
  <button class="btn" id="skip">Skip (resets streak)</button>
</div>

const HUES=[350,22,45,95,150,185,215,255,290,325];
const $=s=>document.querySelector(s);
let n,reg,sol,board,streak=0,best=0,done=false,pop=-1,hearts=3,over=false,note='',finalStreak=0,last={i:-1,t:0,prev:0};
try{best=+localStorage.getItem('chii-best')||0}catch(e){}

const rnd=k=>Math.floor(Math.random()*k);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const pc=x=>{let c=0;while(x){c+=x&1;x>>=1}return c};

function perm(n){
  const p=[],used=Array(n).fill(false);
  (function go(r){
    if(r==n)return true;
    for(const c of shuffle([...Array(n).keys()])){
      if(used[c]||(r&&Math.abs(c-p[r-1])<2))continue;
      used[c]=true;p[r]=c;
      if(go(r+1))return true;
      used[c]=false;
    }
    return false;
  })(0);
  return p;
}
function grow(p,n){
  const g=Array.from({length:n},()=>Array(n).fill(-1));
  p.forEach((c,r)=>g[r][c]=r);
  let left=n*n-n;
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(left){
    const cand=[];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      if(g[r][c]>=0)continue;
      for(const[dr,dc]of D){
        const a=r+dr,b=c+dc;
        if(a>=0&&b>=0&&a<n&&b<n&&g[a][b]>=0)cand.push([r,c,g[a][b]]);
      }
    }
    const[r,c,k]=cand[rnd(cand.length)];
    g[r][c]=k;left--;
  }
  return g;
}

// Human-style solver: only accepts puzzles that can be solved by pure deduction (no guessing).
function solvable(g,n){
  const cand=Array.from({length:n},()=>Array(n).fill(true));
  const q=Array(n).fill(-1);
  const key=[(r,c)=>r,(r,c)=>c,(r,c)=>g[r][c]];
  const K=Math.min(Math.max(1,n>>1),streak<3?1:streak<8?2:9);
  const place=(r,c)=>{
    q[r]=c;
    for(let a=0;a<n;a++)for(let b=0;b<n;b++){
      if(a==r&&b==c)continue;
      if(a==r||b==c||g[a][b]==g[r][c]||(Math.abs(a-r)<2&&Math.abs(b-c)<2))cand[a][b]=false;
    }
  };
  for(let guard=0;guard<300;guard++){
    let ch=false;
    for(let t=0;t<3;t++){
      const cells=Array.from({length:n},()=>[]);
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(cand[r][c])cells[key[t](r,c)].push([r,c]);
      for(let v=0;v<n;v++){
        if(!cells[v].length)return false;
        if(cells[v].length==1){const[r,c]=cells[v][0];if(q[r]!=c){place(r,c);ch=true}}
      }
    }
    for(const[a,b]of[[0,2],[2,0],[1,2],[2,1]]){
      const m=Array(n).fill(0);
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(cand[r][c])m[key[b](r,c)]|=1<<key[a](r,c);
      for(let S=1;S<(1<<n);S++){
        const k=pc(S);
        if(k>K)continue;
        const ins=m.map(x=>x&&!(x&~S));
        if(ins.filter(Boolean).length!=k)continue;
        for(let r=0;r<n;r++)for(let c=0;c<n;c++){
          if(cand[r][c]&&((S>>key[a](r,c))&1)&&!ins[key[b](r,c)]){cand[r][c]=false;ch=true}
        }
      }
    }
    if(!ch)break;
  }
  return q.every(c=>c>=0);
}

function make(){
  let m=Math.max(4,Math.min(10,5+Math.floor(streak/2)+[-1,0,0,1][rnd(4)]));
  for(let t=1;;t++){
    const p=perm(m),g=grow(p,m);
    if(solvable(g,m)){n=m;reg=g;sol=p;return}
    if(t%200==0&&m>4)m--;
  }
}
function newPuzzle(){
  make();
  board=Array.from({length:n},()=>Array(n).fill(0));
  done=false;over=false;hearts=3;note='';last.i=-1;pop=-1;
  render();
}

const found=()=>board.flat().filter(v=>v==2).length;
function win(){
  done=true;streak++;
  if(streak>best){best=streak;try{localStorage.setItem('chii-best',best)}catch(e){}}
}
function render(){
  let h='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const v=board[r][c];
    const cls='cell'+(pop===r*n+c?' pop':'')+(v>=2?' lock':'');
    const inner=v==2?`<img class="chi" src="${CHI}" alt="Chiikawa">`:v==1?'<span class="x">✕</span>':v==3?'<span class="x red">✕</span>':'';
    h+=`<button class="${cls}" style="--h:${HUES[reg[r][c]]}" data-r="${r}" data-c="${c}" aria-label="Row ${r+1}, column ${c+1}">${inner}</button>`;
  }
  const bd=$('#board');
  bd.style.setProperty('--n',n);
  bd.innerHTML=h;
  $('#streak').textContent=streak;
  $('#best').textContent=best;
  $('#size').textContent=n+'×'+n;
  $('#hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);
  const m=$('#msg');
  if(done){
    m.innerHTML='<span>Solved! Streak: '+streak+'</span><button class="btn main" id="next">Next puzzle</button>';
    $('#next').focus();
  }else if(over){
    m.innerHTML='<span>Out of hearts. Final streak: '+finalStreak+'</span><button class="btn main" id="next">Try again</button>';
    $('#next').focus();
  }else{
    m.textContent=note||(found()+' of '+n+' found');
  }
}
function attempt(r,c){
  if(sol[r]==c){
    board[r][c]=2;pop=r*n+c;note='';
    if(found()==n)win();
  }else{
    board[r][c]=3;pop=-1;hearts--;note='Not there. You lost a heart.';
    if(hearts<=0){over=true;finalStreak=streak;streak=0}
  }
  render();
}
function tap(r,c){
  const v=board[r][c],i=r*n+c,now=Date.now();
  if(v>=2)return;
  if(last.i===i&&now-last.t<350){board[r][c]=last.prev;last.i=-1;attempt(r,c);return}
  last={i,t:now,prev:v};
  board[r][c]=v==1?0:1;pop=-1;note='';
  render();
}
let drag=null;
const bd0=$('#board');
const cellAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.cell'):null};
bd0.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.cell');
  if(!t||done||over)return;
  const r=+t.dataset.r,c=+t.dataset.c,v=board[r][c];
  if(v>=2)return;
  drag={r,c,cur:r*n+c,erase:v==1,moved:false};
  try{bd0.setPointerCapture(e.pointerId)}catch(_){}
});
bd0.addEventListener('pointermove',e=>{
  if(!drag)return;
  const t=cellAt(e.clientX,e.clientY);
  if(!t)return;
  const r=+t.dataset.r,c=+t.dataset.c,i=r*n+c;
  if(i===drag.cur)return;
  drag.cur=i;
  const apply=(a,b)=>{const v=board[a][b];if(drag.erase&&v==1)board[a][b]=0;else if(!drag.erase&&v==0)board[a][b]=1};
  if(!drag.moved){drag.moved=true;apply(drag.r,drag.c)}
  apply(r,c);
  last.i=-1;pop=-1;note='';
  render();
});
const endDrag=e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.moved&&e.type=='pointerup')tap(d.r,d.c);
};
bd0.addEventListener('pointerup',endDrag);
bd0.addEventListener('pointercancel',endDrag);
bd0.addEventListener('click',e=>{
  if(e.detail)return;
  const t=e.target.closest('.cell');
  if(t&&!done&&!over)tap(+t.dataset.r,+t.dataset.c);
});
$('#msg').addEventListener('click',e=>{if(e.target.id=='next')newPuzzle()});
$('#clear').addEventListener('click',()=>{if(done||over)return;board=board.map(row=>row.map(v=>v==1?0:v));pop=-1;render()});
$('#skip').addEventListener('click',()=>{streak=0;newPuzzle()});


newPuzzle();
</script>
</body>
</html>
